name: Build and deploy Node.js app to Azure Web App - flight101

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-flight101-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone server
        run: npm run build

      - name: Package Azure deployment
        shell: bash
        run: |
          mkdir azure-package
          cp -R dist/standalone/. azure-package/
          node -e "const fs=require('node:fs'); const path='azure-package/package.json'; const data=JSON.parse(fs.readFileSync(path,'utf8')); data.scripts={start:'node server.js'}; data.engines={node:'>=22.13 <25'}; fs.writeFileSync(path, JSON.stringify(data,null,2)+'\n')"
          test -f azure-package/server.js
          test -f azure-package/node_modules/vinext/package.json
          cd azure-package
          zip -q -r ../azure-package.zip .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: azure-package.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'flight101'
          slot-name: 'Production'
          package: azure-package.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C403975D4CF7412EAC9A9FFD6D6B98E3 }}
